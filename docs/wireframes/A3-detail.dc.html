<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1C 현재 + 그래프 + 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 520px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1E2329; overflow: hidden;">
<section style="position: relative; padding: 8px 20px 16px; background: #2B3440; color: #FFFFFF; overflow: hidden;">
<svg width="390" height="190" style="position: absolute; left: 0; top: 0;" aria-hidden="true"><path d="{{rain}}" stroke="rgba(255,255,255,0.22)" stroke-width="1.4" stroke-linecap="round" fill="none"></path></svg>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
<button type="button" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; background: none; border: 0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500;">집 · 강남구 역삼1동<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-label="설정" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #FFFFFF;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
<div style="position: relative; display: flex; align-items: baseline; gap: 10px;">
<span style="font-size: 56px; font-weight: 700; line-height: 1.1;">8°</span>
<span style="font-size: 16px; font-weight: 500;">비 2mm</span>
</div>
<p style="position: relative; margin: 6px 0 0; font-size: 14px;">어제 이 시간보다 3° 낮아요 · 밤 11시쯤 그쳐요</p>
</section>
<section style="padding: 14px 0 6px;">
<dc-import name="Timeline" w="{{tw}}" range="phone" sel="{{sel}}" hint-size="390px,150px"></dc-import>
</section>
<section style="margin: 6px 16px 0; padding: 12px 14px; border: 1px solid #D5D9DF; border-radius: 12px; display: flex; flex-direction: column; gap: 4px;">
<div style="font-size: 13px; color: #5B6470;">내일 10일 3시 · 예보</div>
<div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 24px; font-weight: 700;">4°</span><span style="font-size: 14px;">체감 1° · 흐림 · 강수 30%</span></div>
<div style="font-size: 14px;">북동풍 3m/s · 습도 70%</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var d = '';
    for (var i = 0; i < 40; i++) {
      var x = (i * 53) % 420 - 20;
      var y = (i * 61) % 200 - 10;
      d += 'M' + x + ' ' + y + 'l-6 18';
    }
    return { rain: d, tw: 390, sel: 7 };
  }
}
</script>
</body>
</html>
