<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>타임라인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1E2329; background: #FFFFFF; font-size: 11px;">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pastW}}px; background: #F1F2F4;"></div>
<sc-if value="{{bandShow}}" hint-placeholder-val="{{ true }}">
<div style="{{bandStyle}}"><span style="position: absolute; bottom: 2px; left: 4px; font-size: 10px; color: #2A62B8; white-space: nowrap;">1시간</span></div>
</sc-if>
<sc-if value="{{selShow}}" hint-placeholder-val="{{ false }}">
<div style="{{selStyle}}"></div>
</sc-if>
<sc-if value="{{showNow}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: {{nowX}}px; top: 0; bottom: 0; width: 2px; background: #2A72E5;"><span style="position: absolute; top: 2px; left: 4px; padding: 0 4px; border-radius: 4px; background: #2A72E5; color: #FFFFFF; font-size: 10px; font-weight: 700; white-space: nowrap;">지금</span></div>
</sc-if>
<div style="position: relative; display: flex; height: 20px; align-items: center;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.dayCell}}">{{c.dayLabel}}</div>
</sc-for>
</div>
<div style="position: relative; display: flex; height: 30px;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}}">
<sc-if value="{{c.isSun}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B26B00" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{c.isMoon}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
<sc-if value="{{c.isCloud}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"></path></svg></sc-if>
<sc-if value="{{c.isRain}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6FB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14h10a3.5 3.5 0 0 0 .4-7 5.5 5.5 0 0 0-10.6 1.3A2.9 2.9 0 0 0 7 14z"></path><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"></path></svg></sc-if>
</div>
</sc-for>
</div>
<div style="position: relative; height: 64px;">
<span style="position: absolute; left: 4px; top: 2px; font-size: 10px; color: #5B6470;">실측</span>
<sc-if value="{{showNow}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; left: {{futLabelX}}px; top: 18px; font-size: 10px; color: #2A62B8;">예보</span></sc-if>
<svg width="{{w}}" height="64" style="display: block;" aria-hidden="true"><polyline points="{{pastPts}}" fill="none" stroke="#8A929C" stroke-width="2" stroke-linejoin="round"></polyline><polyline points="{{futPts}}" fill="none" stroke="#1E2329" stroke-width="2" stroke-linejoin="round"></polyline></svg>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.dotStyle}}"></div>
</sc-for>
</div>
<div style="position: relative; display: flex; height: 18px;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}} font-weight: 500;">{{c.tLabel}}</div>
</sc-for>
</div>
<sc-if value="{{meteo}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; display: flex; height: 36px; align-items: flex-end; border-top: 1px solid #E4E7EB;">
<span style="position: absolute; left: 4px; top: 2px; font-size: 10px; color: #5B6470;">강수량 mm</span>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}} justify-content: flex-end;"><span style="font-size: 10px; color: #2A62B8;">{{c.mmLabel}}</span><div style="{{c.barStyle}}"></div></div>
</sc-for>
</div>
<div style="position: relative; display: flex; height: 20px; align-items: center;">
<span style="position: absolute; left: 4px; top: -12px; font-size: 10px; color: #5B6470;"></span>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}} color: #2A62B8;">{{c.popLabel}}</div>
</sc-for>
</div>
<div style="position: relative; display: flex; height: 24px; align-items: center; border-top: 1px solid #E4E7EB;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="{{c.arrowStyle}}" aria-hidden="true"><path d="M12 20V4M6 10l6-6 6 6"></path></svg></div>
</sc-for>
</div>
<div style="position: relative; display: flex; height: 18px; align-items: center;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}} color: #5B6470;">{{c.windLabel}}</div>
</sc-for>
</div>
<div style="position: relative; display: flex; height: 20px; align-items: center; border-top: 1px solid #E4E7EB;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}} color: #5B6470;">{{c.humLabel}}</div>
</sc-for>
</div>
</sc-if>
<div style="position: relative; display: flex; height: 20px; align-items: center; border-top: 1px solid #E4E7EB;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="{{c.cell}} color: #5B6470;">{{c.hLabel}}</div>
</sc-for>
</div>
<sc-if value="{{bubbleShow}}" hint-placeholder-val="{{ false }}">
<div style="{{bubbleStyle}}">
<div style="font-size: 12px; color: #5B6470;">{{b.title}}</div>
<div style="font-size: 20px; font-weight: 700; margin-top: 2px;">{{b.temp}}</div>
<div style="font-size: 12px; margin-top: 4px;">{{b.line1}}</div>
<div style="font-size: 12px;">{{b.line2}}</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":390},"range":{"editor":"enum","options":["phone","wide","all"],"default":"phone"},"meteo":{"editor":"boolean","default":false},"sel":{"editor":"int","default":-1},"bubble":{"editor":"boolean","default":false},"$preview":{"width":390,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    var P = this.props;
    var w = Number(P.w != null ? P.w : 390);
    var range = P.range || 'phone';
    var meteo = P.meteo === true;
    var sel = Number(P.sel != null ? P.sel : -1);
    var bubble = P.bubble === true;
    var days = [
      { label: '어제 8일', m: 9, cloud: [12, 15], rain: {} },
      { label: '오늘 9일', m: 9, cloud: [9, 12, 15], rain: { 18: 3, 21: 2, 22: 2, 23: 0.5 } },
      { label: '내일 10일', m: 5, cloud: [0, 3, 6, 9], rain: {} },
      { label: '11일 수', m: 4, cloud: [], rain: {} },
      { label: '12일 목', m: 6, cloud: [9, 12, 15, 18, 21], rain: {} },
      { label: '13일 금', m: 7, cloud: [9, 12], rain: { 15: 3, 18: 5 } }
    ];
    var slots = [];
    days.forEach(function (d, di) {
      var hs = di === 1 ? [0, 3, 6, 9, 12, 15, 18, 21, 22, 23] : [0, 3, 6, 9, 12, 15, 18, 21];
      hs.forEach(function (h) { slots.push({ di: di, h: h, hourly: di === 1 && h >= 22 }); });
    });
    var nowIdx = 0;
    slots.forEach(function (s, i) { if (s.di === 1 && s.h === 22) nowIdx = i; });
    var win = range === 'all' ? [0, slots.length] : range === 'wide' ? [4, 30] : [12, 22];
    var vis = slots.slice(win[0], win[1]);
    var n = vis.length;
    var cw = w / n;
    var ts = vis.map(function (s) { return Math.round(days[s.di].m + 4 * Math.cos(2 * Math.PI * (s.h - 15) / 24)); });
    var tmax = Math.max.apply(null, ts), tmin = Math.min.apply(null, ts);
    var H = 64, pad = 12;
    var yOf = function (t) { return pad + (tmax - t) / Math.max(1, tmax - tmin) * (H - 2 * pad); };
    var dirs = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
    var cols = vis.map(function (s, i) {
      var d = days[s.di];
      var mm = d.rain[s.h] || 0;
      var night = s.h < 6 || s.h >= 18;
      var icon = mm > 0 ? 'rain' : d.cloud.indexOf(s.h) >= 0 ? 'cloud' : night ? 'moon' : 'sun';
      var past = win[0] + i < nowIdx;
      var t = ts[i];
      var x = i * cw + cw / 2;
      var y = yOf(t);
      var dayStart = i === 0 || s.h === 0;
      var pop = mm > 0 ? (mm >= 3 ? 80 : 60) : icon === 'cloud' ? 30 : 10;
      var hum = mm > 0 ? 95 : icon === 'cloud' ? 70 : 55;
      var wdeg = (s.di * 70 + s.h * 9) % 360;
      var ws = 1 + ((s.di * 3 + s.h) % 4);
      var cell = 'width: ' + cw + 'px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;' + (dayStart && i > 0 ? ' border-left: 1px solid #D5D9DF;' : '');
      return {
        t: t, x: x, icon: icon, mm: mm, pop: pop, hum: hum, ws: ws, wdir: dirs[Math.round(wdeg / 45) % 8], past: past, s: s,
        tLabel: t + '°',
        hLabel: (s.h < 10 ? '0' : '') + s.h,
        dayLabel: dayStart ? d.label : '',
        isSun: icon === 'sun', isMoon: icon === 'moon', isCloud: icon === 'cloud', isRain: icon === 'rain',
        mmLabel: mm > 0 ? String(mm) : '',
        barStyle: 'width: ' + Math.max(6, cw * 0.45) + 'px; height: ' + Math.min(22, mm * 6) + 'px; background: #5B8FD0; border-radius: 2px 2px 0 0;',
        popLabel: pop + '%',
        humLabel: hum + '%',
        windLabel: ws + '',
        arrowStyle: 'display: block; transform: rotate(' + wdeg + 'deg);',
        cell: cell,
        dayCell: 'width: ' + cw + 'px; flex: none; white-space: nowrap; overflow: visible; color: #5B6470; padding-left: 4px; box-sizing: border-box; height: 20px; line-height: 20px;' + (dayStart && i > 0 ? ' border-left: 1px solid #D5D9DF;' : ''),
        dotStyle: 'position: absolute; left: ' + (x - 3) + 'px; top: ' + (y - 3) + 'px; width: 6px; height: 6px; border-radius: 3px; background: ' + (past ? '#8A929C' : '#1E2329') + ';'
      };
    });
    var pts = cols.map(function (c) { return c.x.toFixed(1) + ',' + yOf(c.t).toFixed(1); });
    var nowLocal = nowIdx - win[0];
    var inWin = nowLocal >= 0 && nowLocal < n;
    var split = inWin ? nowLocal : (nowLocal < 0 ? 0 : n - 1);
    var nowX = inWin ? cols[nowLocal].x : (nowLocal < 0 ? 0 : w);
    var hourly = [];
    vis.forEach(function (s, i) { if (s.hourly) hourly.push(i); });
    var bandShow = hourly.length > 0;
    var bandStyle = bandShow ? 'position: absolute; top: 0; bottom: 0; left: ' + (hourly[0] * cw) + 'px; width: ' + (hourly.length * cw) + 'px; background: #EAF1FC;' : '';
    var selShow = sel >= 0 && sel < n;
    var sc = selShow ? cols[sel] : null;
    var selStyle = selShow ? 'position: absolute; top: 20px; bottom: 0; left: ' + (sel * cw + 1) + 'px; width: ' + (cw - 2) + 'px; border: 2px solid #2A72E5; border-radius: 6px; box-sizing: border-box;' : '';
    var bw = 168;
    var bx = selShow ? Math.max(4, Math.min(w - bw - 4, sc.x - bw / 2)) : 0;
    var bubbleStyle = 'position: absolute; top: -96px; left: ' + bx + 'px; width: ' + bw + 'px; box-sizing: border-box; padding: 8px 10px; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.16);';
    var b = sc ? {
      title: days[sc.s.di].label + ' ' + sc.s.h + '시 · ' + (sc.past ? '실측' : '예보'),
      temp: sc.t + '° 체감 ' + (sc.t - 3) + '°',
      line1: ({ sun: '맑음', moon: '맑음', cloud: '흐림', rain: '비 ' + sc.mm + 'mm' })[sc.icon] + ' · 강수 ' + sc.pop + '%',
      line2: sc.wdir + '풍 ' + sc.ws + 'm/s · 습도 ' + sc.hum + '%'
    } : { title: '', temp: '', line1: '', line2: '' };
    return {
      w: w, cols: cols, meteo: meteo,
      pastPts: pts.slice(0, split + 1).join(' '),
      futPts: pts.slice(split).join(' '),
      showNow: inWin, nowX: nowX - 1, futLabelX: nowX + 6,
      pastW: Math.max(0, nowX),
      bandShow: bandShow, bandStyle: bandStyle,
      selShow: selShow, selStyle: selStyle,
      bubbleShow: bubble && selShow, bubbleStyle: bubbleStyle, b: b
    };
  }
}
</script>
</body>
</html>
