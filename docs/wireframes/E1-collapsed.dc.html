<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>5A 스크롤 후 접힌 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1E2329; overflow: hidden;">
<section style="position: relative; padding: 8px 20px 14px; background: #2B3440; color: #FFFFFF; overflow: hidden; flex: none;">
<svg width="390" height="170" style="position: absolute; left: 0; top: 0;" aria-hidden="true"><path d="{{rain}}" stroke="rgba(255,255,255,0.22)" stroke-width="1.4" stroke-linecap="round" fill="none"></path></svg>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
<button type="button" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; background: none; border: 0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500;">집 · 강남구 역삼1동<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-label="메뉴" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #FFFFFF;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
<div style="position: relative; display: flex; align-items: baseline; gap: 10px;"><span style="font-size: 48px; font-weight: 700; line-height: 1.1;">8°</span><span style="font-size: 16px; font-weight: 500;">비 2mm</span></div>
<p style="position: relative; margin: 4px 0 0; font-size: 14px;">어제 이 시간보다 3° 낮아요 · 밤 11시쯤 그쳐요</p>
</section>
<section style="padding: 14px 0 6px; flex: none;">
<dc-import name="Timeline" w="{{tw}}" range="phone" sel="{{sel}}" hint-size="390px,150px"></dc-import>
</section>
<section style="margin: 6px 16px 0; padding: 12px 14px; border: 1px solid #D5D9DF; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; flex: none;">
<div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 13px; color: #5B6470;">지금 22시 · 실황 (22시 관측)</span></div>
<div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 26px; font-weight: 700;">8°</span><span style="font-size: 14px;">체감 5° · 비 2mm</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 14px;">
<span>강수확률 60% (예보)</span><span>습도 95%</span>
<span>북서풍 2m/s</span><span>어제 같은 시각 11°</span>
</div>
</section>
<div style="margin: 20px 20px 8px; font-size: 15px; font-weight: 700;">일별</div>
<div style="margin: 0 16px; border-top: 1px solid #E4E7EB; display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 14px;"><span style="width: 64px; color: #5B6470;">어제 8일</span><span style="flex-grow: 1;">맑음</span><span>5° / 13°</span></div>
<div style="margin: 0 16px; border-top: 1px solid #E4E7EB; display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 14px;"><span style="width: 64px; font-weight: 700;">오늘 9일</span><span style="flex-grow: 1;">흐리고 저녁 비</span><span>5° / 13°</span></div>
<div style="margin: 0 16px; padding: 10px 12px; background: #F1F2F4; border-radius: 10px; font-size: 13px; color: #424A55; margin-top: auto; margin-bottom: 16px;">아래로 스크롤하면 1A의 큰 현재 날씨가 이 크기로 줄어듭니다. 상세 패널은 기본으로 '지금'을 보여 주고, 칸을 누르면 그 칸으로 바뀝니다.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = '';
    for (var i = 0; i < 40; i++) {
      var x = (i * 53) % 420 - 20;
      var y = (i * 61) % 180 - 10;
      d += 'M' + x + ' ' + y + 'l-6 18';
    }
    return { rain: d, tw: 390, sel: 4 };
  }
}
</script>
</body>
</html>
