<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>4B 데스크톱 2단</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 560px; background: #EEF1F5; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1E2329; padding: 24px 16px; box-sizing: border-box;">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
<aside style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 8px;">
<label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #FFFFFF; border: 1px solid #C4C9D0; border-radius: 10px; color: #5B6470;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="동 이름으로 검색" style="flex-grow: 1; border: 0; outline: none; font: inherit; font-size: 14px; background: none; color: #1E2329;"></label>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: none; border: 0; font: inherit; font-size: 14px; color: #2A62B8; text-align: left;">현재 위치 보기</button>
<button type="button" aria-current="page" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #2B3440; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; text-align: left;">
<svg width="300" height="120" style="position: absolute; left: 0; top: 0;" aria-hidden="true"><path d="{{rain}}" stroke="rgba(255,255,255,0.2)" stroke-width="1.4" stroke-linecap="round" fill="none"></path></svg>
<span style="position: relative; font-size: 14px; font-weight: 700;">집 · 강남구 역삼1동</span>
<span style="position: relative; font-size: 36px; font-weight: 700; line-height: 1.1;">8° <span style="font-size: 15px; font-weight: 500;">비 2mm</span></span>
<span style="position: relative; font-size: 13px;">어제보다 3° 낮음 · 23시 그침</span>
</button>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 12px; font: inherit; text-align: left; color: #1E2329;"><span style="font-size: 14px; font-weight: 700;">회사 <span style="font-weight: 400; color: #424A55;">· 서교동</span></span><span style="font-size: 15px;">10° 흐림</span></button>
</aside>
<main style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 12px; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px;">
<div style="overflow-x: auto;">
<dc-import name="Timeline" w="{{tw}}" range="wide" meteo="{{yes}}" sel="{{sel}}" hint-size="880px,290px"></dc-import>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 10px 12px; border-top: 1px solid #E4E7EB; font-size: 14px;">
<b>내일 10일 3시 · 예보</b><span>4° 체감 1°</span><span>흐림 · 강수 30%</span><span>북동풍 3m/s</span><span>습도 70%</span>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    var d = '';
    for (var i = 0; i < 30; i++) {
      var x = (i * 53) % 320 - 10;
      var y = (i * 41) % 130 - 10;
      d += 'M' + x + ' ' + y + 'l-5 14';
    }
    return { rain: d, tw: 880, yes: true, sel: 15 };
  }
}
</script>
</body>
</html>
