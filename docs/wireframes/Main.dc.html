<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1A 큰 현재 날씨</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 640px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1E2329; overflow: hidden;">
<section style="position: relative; height: 430px; flex: none; background: #2B3440; color: #FFFFFF; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">
<svg width="390" height="430" style="position: absolute; left: 0; top: 0;" aria-hidden="true"><path d="{{rain}}" stroke="rgba(255,255,255,0.22)" stroke-width="1.4" stroke-linecap="round" fill="none"></path></svg>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
<button type="button" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; background: none; border: 0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500;">집 · 강남구 역삼1동<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-label="설정" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #FFFFFF;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
<div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
<div style="font-size: 96px; font-weight: 700; line-height: 1; letter-spacing: -2px;">8°</div>
<div style="font-size: 18px; font-weight: 500;">비 · 시간당 2mm · 체감 5°</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px; font-size: 15px;">
<p style="margin: 0;">어제 이 시간보다 <b>3° 낮아요</b></p>
<p style="margin: 0;">밤 11시쯤 그치고, 내일 아침 4°까지 내려가요</p>
</div>
</section>
<section style="padding: 16px 0 8px; display: flex; flex-direction: column; gap: 8px;">
<dc-import name="Timeline" w="{{tw}}" range="phone" hint-size="390px,150px"></dc-import>
</section>
<div style="padding: 4px 20px; font-size: 12px; color: #5B6470;">← 넘기면 어제 · 넘기면 모레 →</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var d = '';
    for (var i = 0; i < 70; i++) {
      var x = (i * 53) % 420 - 20;
      var y = (i * 97) % 440 - 20;
      d += 'M' + x + ' ' + y + 'l-6 18';
    }
    return { rain: d, tw: 390 };
  }
}
</script>
</body>
</html>
